<div
  class="auth-callback"
  crucibleLandingBackground
  [style.min-height]="minHeight()"
>
  @if (errorMessage()) {
    <div id="error" class="auth-callback__card" role="alert">
      <p class="auth-callback__title">We couldn't sign you in</p>
      <p class="auth-callback__message">{{ errorMessage() }}</p>
      <button
        type="button"
        class="auth-callback__button"
        [disabled]="retrying()"
        (click)="signInAgain()"
      >
        Sign in again
      </button>
    </div>
  } @else {
    <div class="auth-callback__card" role="status">
      <div class="auth-callback__spinner" aria-hidden="true"></div>
      <p id="waiting" class="auth-callback__title">
        Verifying authentication...
      </p>
    </div>
  }
</div>
