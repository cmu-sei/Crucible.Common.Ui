name: Build and Test

# Pull requests validate proposed changes. Pushes to main verify the result after merge.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    uses: cmu-sei/Crucible-Github-Actions/.github/workflows/npm-test.yaml@npm-test-v1
    permissions:
      contents: read
    with:
      node-version: '24'
      # Fails on new lint errors. eslint-suppressions.json holds the existing ones.
      lint-command: npm run lint
      # Fails when a file is not formatted. Run npm run format to fix it.
      format-command: npm run format:check
      # The release's build, so a pull request catches a broken package.
      build-command: npm run pack
